version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Keep the serving images' base (python:3.12-slim) patched.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
