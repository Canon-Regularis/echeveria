name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job in this workflow only reads the repository. The release and docs-deploy
# workflows request the extra scopes they need for publishing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # ruff is a static analyser and imports none of the project, so it needs no dependencies. A
      # dedicated job gives lint feedback in seconds instead of waiting for the scientific stack, and
      # runs the check once rather than three times across the version matrix.
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: type · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,stats,api,dashboard]"

      # mypy pins python_version = 3.12 in its config, so its result is identical on every matrix leg;
      # run it once, on that leg, rather than three times.
      - name: Mypy (strict)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Pytest + coverage
        run: pytest

  security:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[ml,stats,api]"
      - name: Audit installed dependencies for known vulnerabilities
        run: pip-audit

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Measure the classical pipeline
        run: pytest tests/benchmarks --benchmark-enable --no-cov

  build:
    name: build & verify wheel (py.typed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Assert py.typed is shipped
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "phytovision/py.typed" in names, f"py.typed missing from wheel: {names}"
          print("ok: py.typed present in", wheel)
          PY
